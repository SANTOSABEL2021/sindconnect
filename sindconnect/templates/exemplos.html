<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exemplo Bootstrap</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="#">SindConnect</a>
    </div>
</nav>

<!-- CONTAINER -->
<div class="container mt-4">

    <h1 class="mb-4">Painel Administrativo</h1>

    <!-- ROW E COL -->
    <div class="row">

        <!-- CARD 1 -->
        <div class="col-md-4">
            <div class="card p-3 mb-3">
                <h5>Total de Sócios</h5>
                <h2>120</h2>
                <button class="btn btn-primary">Ver sócios</button>
            </div>
        </div>

        <!-- CARD 2 -->
        <div class="col-md-4">
            <div class="card p-3 mb-3">
                <h5>Mensalidades</h5>
                <h2>R$ 5.400</h2>
                <button class="btn btn-success">Ver pagamentos</button>
            </div>
        </div>

        <!-- CARD 3 -->
        <div class="col-md-4">
            <div class="card p-3 mb-3">
                <h5>Pendências</h5>
                <h2>8</h2>
                <button class="btn btn-danger">Ver pendências</button>
            </div>
        </div>

    </div>

    <!-- FORMULÁRIO -->
    <div class="card p-3 mt-4">
        <h4>Cadastrar Sócio</h4>

        <div class="mb-3">
            <label class="form-label">Nome</label>
            <input type="text" class="form-control" placeholder="Digite o nome">
        </div>

        <div class="mb-3">
            <label class="form-label">CPF</label>
            <input type="text" class="form-control" placeholder="Digite o CPF">
        </div>

        <!-- D-FLEX -->
        <div class="d-flex justify-content-end gap-2">
            <button class="btn btn-secondary">Cancelar</button>
            <button class="btn btn-primary">Salvar</button>
        </div>
    </div>

    <!-- TABELA -->
    <div class="card p-3 mt-4">
        <h4>Lista de Sócios</h4>

        <table class="table table-striped table-bordered">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>Status</th>
                    <th>Ação</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>João Silva</td>
                    <td>000.000.000-00</td>
                    <td>Ativo</td>
                    <td>
                        <button class="btn btn-sm btn-warning">Editar</button>
                    </td>
                </tr>

                <tr>
                    <td>Maria Souza</td>
                    <td>111.111.111-11</td>
                    <td>Pendente</td>
                    <td>
                        <button class="btn btn-sm btn-danger">Excluir</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
