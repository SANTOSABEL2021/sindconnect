{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>SindConnect</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/home_socio.css' %}" rel="stylesheet">
</head>
<body>

<div class="d-flex">

    <aside class="sidebar" id="sidebar">
        <div class="logo-area">
            <div class="logo-icon">👥</div>
            <div>
                <h3>SindConnect</h3>
                <span>Gestão de Sindicatos</span>
            </div>
        </div>

        <a href="{% url 'home_socio' %}" class="menu-item">🏠 Início</a>

        <p class="menu-title">MEU PERFIL</p>
        <a href="{% url 'socio_dados' %}" class="menu-item">👤 Meus Dados</a>
        <a href="{% url 'socio_documentos' %}" class="menu-item">📄 Documentos</a>

        <p class="menu-title">FINANCEIRO</p>
        <a href="{% url 'socio_mensalidades' %}" class="menu-item">💰 Minhas Mensalidades</a>
        <a href="{% url 'socio_pagamentos' %}" class="menu-item">💳 Meus Pagamentos</a>

        <div class="logout-area">

        <p class="menu-title">SISTEMA</p>

        <a href="{% url 'logout' %}" class="menu-item logout">
        🚪 Sair
        </a>

</div>
    </aside>

    <main class="main-content w-100">

        <header class="topbar d-flex justify-content-between align-items-center">
            <button class="btn-menu" onclick="toggleSidebar()">☰</button>

            <div class="user-area">
                <span class="notification">🔔<small>2</small></span>
                <div class="avatar">👤</div>
                <div>
                    <strong>{{ request.user.first_name|default:request.user.username }}</strong><br>
                    <small>Perfil: Sócio</small>
                </div>
            </div>
        </header>

        <section class="content-area">

            {% block conteudo %}
            {% endblock %}

        </section>

    </main>

</div>

<script src="{% static 'js/home_socio.js' %}"></script>
</body>
</html>
