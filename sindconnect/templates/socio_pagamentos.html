{% extends 'base_socio.html' %}

{% block conteudo %}

<h1>Meus Dados</h1>
<p>Visualize e atualize seus dados cadastrais.</p>

<div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
        Sócio Pagamentos
    </div>

    <div class="card-body">

        <form>
            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">Nome completo</label>
                    <input type="text" class="form-control" value="{{ request.user.first_name }}">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">CPF</label>
                    <input type="text" class="form-control" value="{{ request.user.username }}">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">E-mail</label>
                    <input type="email" class="form-control" value="{{ request.user.email }}">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Telefone</label>
                    <input type="text" class="form-control">
                </div>

            </div>

            <button class="btn btn-primary">
                Salvar Alterações
            </button>
        </form>

    </div>
</div>

{% endblock %}
