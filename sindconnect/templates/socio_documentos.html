{% extends 'base_socio.html' %}

{% block conteudo %}

<h1>Documentos</h1>
<p>Documentos disponíveis para download.</p>

<div class="card shadow-sm">

    <div class="card-header bg-primary text-white">
        Meus Documentos
    </div>

    <div class="card-body">

        <table class="table table-hover">

            <thead>
                <tr>
                    <th>Documento</th>
                    <th>Data</th>
                    <th>Ação</th>
                </tr>
            </thead>

            <tbody>

                {% for documento in documentos %}

                <tr>
                    <td>{{ documento.nome }}</td>
                    <td>{{ documento.data }}</td>

                    <td>
                        <a href="{{ documento.arquivo.url }}"
                           class="btn btn-primary btn-sm">

                            Download

                        </a>
                    </td>

                </tr>

                {% empty %}

                <tr>
                    <td colspan="3">
                        Nenhum documento disponível.
                    </td>
                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

{% endblock %}
